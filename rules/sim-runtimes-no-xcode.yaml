# Simulator runtimes left on disk after Xcode went: 5–10 GB each, in
# root-owned folders that simdiskimaged manages. With Xcode gone `xcrun`
# finds no simctl, so sim-runtimes lists nothing; the
# sim-runtimes-no-xcode query (internal/scanner/tool_simruntime.go)
# then lists them through the simctl CoreSimulator keeps outside Xcode.
# While xcrun finds simctl, or an Xcode app is installed, it lists
# nothing, so the two rules never list the same runtime. Surface-only:
# the note says how to delete one.
id: sim-runtimes-no-xcode
title: Simulator runtimes (no Xcode)
category: xcode
risk: surface-only
tool_query: sim-runtimes-no-xcode
note: "Regrow does not delete these. With the simctl Xcode left behind, /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/bin/simctl runtime list names each runtime's identifier, and the same simctl's runtime delete <identifier> --dry-run shows what would go; without --dry-run it is meant to delete it, which is untested without Xcode. Simulators of a deleted runtime stop booting until it is downloaded again."
scans: "`xcrun --find simctl`; the apps named like Xcode in `/Applications` and `~/Applications` and one folder down, with their `Info.plist`; Spotlight (`mdfind` for Xcode's bundle identifier); and, only when none of these finds Xcode, `simctl runtime list -j` from CoreSimulator's own copy, `/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/bin/simctl`"
keeps:
  - "every runtime while `xcrun` finds `simctl`, when `sim-runtimes` lists them, or an Xcode is installed; with an Xcode installed but `xcode-select` pointing at the Command Line Tools, neither rule lists them"
  - "every runtime when an Xcode-named app, an Applications folder or a link there cannot be read or followed, since an Xcode there cannot be ruled out"
regen:
  story: Xcode downloads a runtime again when a simulator needs it (Settings ▸ Components).
  cost: n/a — regrow never deletes these; a 5–10 GB download per runtime if one is needed again
sudo: false
beta: true
fixture:
  items:
    - label: iOS 18.3 (22D8075)
      arg: 11111111-2222
      bytes: 8700000000
