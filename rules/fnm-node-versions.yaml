# Node versions installed with fnm that nothing names. fnm keeps each
# version whole in <fnm dir>/node-versions/<version>/, with the npm
# packages installed globally into it (100–800 MB each here), and never
# removes one by itself. The fnm-node-versions query
# (internal/scanner/tool_fnm.go) keeps a version when an fnm alias
# (the default included) points at it, a .nvmrc or .node-version under
# the project roots or in the home folder resolves to it the way fnm
# resolves one, a launchd plist in ~/Library/LaunchAgents,
# /Library/LaunchAgents or /Library/LaunchDaemons names a path into it
# or runs fnm with it, or a running process executes or maps a file from
# it. A source that cannot be read or parsed offers nothing, and so does
# a run under sudo. nvm is not covered.
id: fnm-node-versions
title: Node versions nothing references (fnm)
category: toolchains
risk: caution
tool_query: fnm-node-versions
native_command: fnm uninstall {arg}
# The four sources are read again right before each uninstall.
pre_action: fnm-version-recheck
note: A project that pins this version only in package.json engines or sits outside the project roots, a shell where you ran `fnm use` with it, and a cron job are not checked; each asks for `fnm install` again.
scans: "fnm's folder (`$FNM_DIR`, or whichever exists of `fnm` in `$XDG_DATA_HOME` (else `~/.local/share`), `~/.fnm` and `~/Library/Application Support/fnm`) with its `node-versions` and `aliases`; every `.nvmrc` and `.node-version` in your home folder and in folders up to 10 levels below `~/workspace`, `~/dev`, `~/projects`, `~/src` and `~/code`, without following a symlinked folder or entering `.git`, `.Trash`, `Library` or `node_modules`; the launchd job plists in `~/Library/LaunchAgents`, `/Library/LaunchAgents` and `/Library/LaunchDaemons`, and the version files in each folder a plist names and the folders above it; and the files your running processes execute or map (`lsof -d txt`)"
keeps:
  - "a version an fnm alias points at, the default included"
  - "a version a `.nvmrc` or `.node-version` there resolves to, the way fnm resolves one (`20` is the newest installed 20.x)"
  - "a version a launchd job's plist names (any string holding its `/node-versions/<version>` folder, or an absolute path that leads into it through links), runs through fnm (`fnm exec --using=18`), or leads fnm to through a version file"
  - "a version a running process of yours executes or maps a file from"
  - "a folder in `node-versions` not named like a release (`vX.Y.Z`)"
  - "every version, when any of those cannot be read or understood, when fnm has more than one folder and `FNM_DIR` names none, when a folder belongs to another user (a run under `sudo`), or when `fnm` is not on your `PATH`: the rule then shows an error and offers nothing"
regen:
  story: fnm install <version> downloads and installs it again; npm packages installed globally into it need installing again too.
  cost: a download of about 30–50 MB per version, plus its global packages; needs the network
sudo: false
beta: true
fixture:
  items:
    - label: Node v16.20.2
      arg: v16.20.2
      path: ~/Library/Application Support/fnm/node-versions/v16.20.2
      bytes: 90000000
    - label: Node v18.17.1
      arg: v18.17.1
      path: ~/Library/Application Support/fnm/node-versions/v18.17.1
      bytes: 120000000
