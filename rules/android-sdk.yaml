# An Android SDK that Android Studio left behind: ~/Library/Android/sdk
# (platforms, build-tools, system images, emulator, NDKs), offered as one
# folder while no Android Studio is installed (the android-ndk rule's
# check). The NDKs inside are android-ndk's rows; the ledger counts
# their bytes there and this row's share is the rest. An SDK anywhere
# else was put there by hand and is never offered.
id: android-sdk
title: Android SDK (no Android Studio)
category: toolchains
risk: caution
tool_query: android-sdk
note: Command-line Android builds (Gradle, React Native, Flutter) use the SDK without Studio, and emulators need its system images; the row says when ANDROID_HOME points here. Undo restores it from the Trash.
scans: "`~/Library/Android/sdk` as one folder; `ANDROID_HOME` and `ANDROID_SDK_ROOT`, to say on the row when one points at it; and, to tell whether an Android Studio is installed, the apps in `/Applications` and `~/Applications` and one folder down, JetBrains Toolbox's apps in `~/Library/Application Support/JetBrains/Toolbox/apps`, and Spotlight (`mdfind` for Android Studio's bundle identifier)"
keeps:
  - "the SDK while an Android Studio is installed in any of those places"
  - "the SDK when an Applications folder or JetBrains Toolbox's apps folder cannot be read in full, or a link in an Applications folder cannot be followed: the rule then shows an error. A Toolbox folder that is a link leading nowhere, and `mdfind` missing, failing or finding nothing, count as no Android Studio; `mdfind` hanging ends in the query's 2-minute error"
  - "an SDK anywhere but `~/Library/Android/sdk`, or reached through a symlink"
regen:
  story: Installing Android Studio, or sdkmanager from the command-line tools, downloads the SDK packages a build needs again.
  cost: several GB of downloads; needs the network
sudo: false
beta: true
fixture:
  items:
    - label: Android SDK — ANDROID_HOME points here
      path: ~/Library/Android/sdk
      bytes: 11000000000
